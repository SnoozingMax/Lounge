/* friends */
async function loadFriends(){
  const { data, error } = await sb.from('friendships').select('*');
  S.friends.clear();
  if (error) { renderFriendBadge(); return; }
  for (const f of data) {
    const other = f.requester === S.me.id ? f.addressee : f.requester;
    S.friends.set(other, f.status === 'accepted' ? 'friends' : f.requester === S.me.id ? 'out' : 'in');
  }
  renderFriendBadge();
}
function incomingCount(){ let n = 0; for (const v of S.friends.values()) if (v === 'in') n++; return n; }
function renderFriendBadge(){
  const n = incomingCount();
  let f = 0; for (const v of S.friends.values()) if (v === 'friends') f++;
  $('friendsBtn').innerHTML = `<span class="gicon">${I.heart}</span><span class="lbl">Friends</span>${n ? `<span class="badge" title="Friend requests">${n > 9 ? '9+' : n}</span>` : f ? `<span class="fr-n">${f}</span>` : ''}`;
  $('friendsBtn').classList.toggle('unread', !!n);
}
async function onFriendship({ eventType, new: n, old: o }){
  const r = eventType === 'DELETE' ? o : n;
  if (!r || !S.me || (r.requester !== S.me.id && r.addressee !== S.me.id)) return;
  const other = r.requester === S.me.id ? r.addressee : r.requester;
  const before = S.friends.get(other);
  if (eventType === 'DELETE') S.friends.delete(other);
  else S.friends.set(other, r.status === 'accepted' ? 'friends' : r.requester === S.me.id ? 'out' : 'in');
  const after = S.friends.get(other), name = dn(S.profiles.get(other)) || 'Someone';
  if (after === 'in' && before !== 'in') { toast(`${name} sent you a friend request`); ping(); }
  if (after === 'friends' && before === 'out') { toast(`${name} accepted your friend request`); ping(); }
  renderFriendBadge(); if (friendsModal) friendsModal.draw();
}
function friendBtnHTML(uid){
  const st = S.friends.get(uid);
  if (st === 'friends') return '<button class="btn" data-a="f-remove">Unfriend</button>';
  if (st === 'out') return '<button class="btn" data-a="f-cancel">Requested · Cancel</button>';
  if (st === 'in') return '<button class="btn primary" data-a="f-accept">Accept friend</button><button class="btn" data-a="f-decline">Decline</button>';
  return '<button class="btn" data-a="f-add">Add friend</button>';
}
async function friendAction(uid, a){
  const name = dn(S.profiles.get(uid));
  let r;
  if (a === 'add') {
    r = await sb.rpc('friend_request', { p_user: uid });
    if (!r.error) { S.friends.set(uid, r.data === 'friends' ? 'friends' : 'out'); toast(r.data === 'friends' ? `You and ${name} are friends` : `Friend request sent to ${name}`); }
  } else if (a === 'accept') {
    r = await sb.rpc('friend_accept', { p_user: uid });
    if (!r.error) { S.friends.set(uid, 'friends'); toast(`You and ${name} are friends`); }
  } else {
    if (a === 'remove' && !await confirmBox(`Unfriend ${name}?`, 'You can add them again later.', 'Unfriend')) return;
    r = await sb.rpc('friend_remove', { p_user: uid });
    if (!r.error) S.friends.delete(uid);
  }
  if (r.error) toast(/friendships|function/i.test(r.error.message) ? 'Friends aren’t set up yet. Run friends.sql in Supabase.' : friendly(r.error));
  renderFriendBadge(); if (friendsModal) friendsModal.draw();
}
let friendsModal = null;
function openFriends(startTab){
  let tab = startTab || (incomingCount() ? 'requests' : 'friends'), q = '';
  const m = openModal(`<h3>Friends</h3><p class="hint">Add people to keep them close.</p>
    <div class="seg" id="frTabs"></div><div id="frBody" style="margin-top:14px"></div>`, 'admin');
  const body = m.el.querySelector('#frBody');
  const row = (p, acts, sub) => `<div class="urow" data-id="${p.id}">${avatarHTML(p, 32, true)}<div class="nm">${esc(dn(p))}<span class="sub">${sub || '@' + esc(p.username)}</span></div><div class="acts">${acts}</div></div>`;
  const byOnline = (a, b) => (S.online.has(b.id) - S.online.has(a.id)) || dn(a).localeCompare(dn(b));
  const ids = st => [...S.friends].filter(([, v]) => v === st).map(([id]) => S.profiles.get(id)).filter(Boolean).sort(byOnline);
  m.draw = () => {
    const nIn = incomingCount();
    m.el.querySelector('#frTabs').innerHTML = [['friends', `Friends · ${ids('friends').length}`], ['requests', `Requests${nIn ? ' · ' + nIn : ''}`], ['add', 'Add']]
      .map(([k, l]) => `<button type="button" data-t="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('');
    if (tab === 'friends') {
      const list = ids('friends');
      body.innerHTML = list.length ? list.map(p => row(p, `<button class="btn sm" data-a="dm">Message</button><button class="btn sm" data-a="f-remove">Unfriend</button>`, S.online.has(p.id) ? (esc(p.status) || 'Online') : 'Offline')).join('')
        : '<div class="pick-empty">No friends yet. Tap <b>Add</b> to find people.</div>';
    } else if (tab === 'requests') {
      const inc = ids('in'), out = ids('out');
      body.innerHTML = (inc.length ? `<div class="mem-h" style="margin-top:0">Incoming</div>${inc.map(p => row(p, `<button class="btn sm primary" data-a="f-accept">Accept</button><button class="btn sm" data-a="f-decline">Decline</button>`)).join('')}` : '')
        + (out.length ? `<div class="mem-h">Sent</div>${out.map(p => row(p, `<button class="btn sm" data-a="f-cancel">Cancel</button>`)).join('')}` : '')
        || '<div class="pick-empty">No requests right now.</div>';
    } else {
      const people = [...S.profiles.values()].filter(p => p.id !== S.me.id && S.friends.get(p.id) !== 'friends'
        && (p.username.toLowerCase().includes(q) || (p.display_name || '').toLowerCase().includes(q))).sort(byOnline);
      body.innerHTML = `<input class="inp" id="frQ" placeholder="Search people" value="${esc(q)}" autocapitalize="off" spellcheck="false"><div style="margin-top:8px">${people.map(p => {
        const st = S.friends.get(p.id);
        return row(p, st === 'out' ? '<button class="btn sm" data-a="f-cancel">Requested</button>' : st === 'in' ? '<button class="btn sm primary" data-a="f-accept">Accept</button>' : '<button class="btn sm" data-a="f-add">Add friend</button>');
      }).join('') || '<div class="pick-empty">No one found</div>'}</div>`;
      const qi = body.querySelector('#frQ');
      qi.oninput = () => { q = qi.value.trim().toLowerCase(); const pos = qi.selectionStart; m.draw(); const n = body.querySelector('#frQ'); n.focus(); n.setSelectionRange(pos, pos); };
    }
  };
  m.el.querySelector('#frTabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; m.draw(); } };
  body.onclick = e => {
    const b = e.target.closest('[data-a]'), r = e.target.closest('.urow');
    if (!r) return;
    const uid = r.dataset.id;
    if (!b) { openProfile(uid); return; }
    if (b.dataset.a === 'dm') { m.close(); openDm(uid); return; }
    friendAction(uid, b.dataset.a.slice(2));
  };
  friendsModal = m; m.onclose = () => { friendsModal = null; };
  m.draw();
}
$('friendsBtn').onclick = () => openFriends();
renderFriendBadge();

/* admin panel */
let adminModal = null;
function openAdmin(){
  if (!S.me.is_admin) return toast('Admins only');
  const m = openModal(`<h3>Admin panel</h3><p class="hint">You’re in charge here.</p>
    <div class="seg" id="adTabs"></div>
    <div id="adBody" style="margin-top:14px"></div>
    <div class="divider"></div>
    <p class="hint" style="margin:0;line-height:1.8">Chat commands: <code>/mute @user 10</code> <code>/unmute @user</code> <code>/ban @user</code> <code>/unban @user</code> <code>/admin</code><br>Start a message with <code>@silent</code> to ping without a sound.</p>`, 'admin');
  const body = m.el.querySelector('#adBody');
  let tab = S.waiting.size ? 'waiting' : 'users', q = '';
  const draw = async () => {
    m.el.querySelector('#adTabs').innerHTML = [['waiting', `Waiting${S.waiting.size ? ' · ' + S.waiting.size : ''}`], ['users', 'Users'], ['channels', 'Channels'], ['stats', 'Stats']]
      .map(([k, l]) => `<button type="button" data-t="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('');
    if (tab === 'waiting') {
      const list = [...S.waiting.values()].sort((a, b) => a.created_at.localeCompare(b.created_at));
      const { data: cfg } = await sb.from('app_settings').select('require_approval').eq('id', 1).maybeSingle();
      const on = cfg ? cfg.require_approval : true;
      body.innerHTML = `<label class="toggle" style="margin:0 0 12px"><input type="checkbox" id="adReq" ${on ? 'checked' : ''}><span>New accounts have to wait for approval</span></label>
        ${list.map(p => `<div class="urow" data-wait="${p.id}">${avatarHTML(p, 30)}<div class="nm">${esc(p.username)}<span class="sub">Signed up ${fmtStamp(p.created_at)}</span></div><div class="acts"><button class="btn sm primary" data-a="approve">Let in</button><button class="btn sm danger" data-a="deny">Deny</button></div></div>`).join('')
          || `<div class="pick-empty">${on ? 'No one waiting.' : 'Waiting room is off. Anyone who signs up gets in right away.'}</div>`}`;
      body.querySelector('#adReq').onchange = async e => {
        const { error } = await sb.rpc('admin_set_approval', { p_on: e.target.checked });
        if (error) { toast(friendly(error)); e.target.checked = !e.target.checked; return; }
        toast(e.target.checked ? 'Waiting room on' : 'Waiting room off'); draw();
      };
      return;
    }
    if (tab === 'users') {
      const people = [...S.profiles.values()].filter(p => p.username.toLowerCase().includes(q) || (p.display_name || '').toLowerCase().includes(q))
        .sort((a, b) => (b.id === S.me.id) - (a.id === S.me.id) || b.is_admin - a.is_admin || (S.online.has(b.id) - S.online.has(a.id)) || a.username.localeCompare(b.username));
      body.innerHTML = `<input class="inp" id="adQ" placeholder="Search ${S.profiles.size} users" value="${esc(q)}" autocapitalize="off"><div style="margin-top:8px">${people.map(p => {
        const me = p.id === S.me.id, mu = isMuted(p);
        const flags = [p.is_admin && 'admin', p.banned && 'banned', mu && `muted ${fmtMins(Math.ceil((new Date(p.muted_until) - Date.now()) / 60000))} left`, S.online.has(p.id) && 'online'].filter(Boolean).join(' · ');
        return `<div class="urow" data-id="${p.id}">${avatarHTML(p, 30, true)}<div class="nm">${esc(dn(p))}<span class="sub">@${esc(p.username)}${flags ? ' · ' + flags : ''}</span></div>${me ? '<span class="tag">you</span>' : `<div class="acts"><button class="btn sm" data-a="${mu ? 'unmute' : 'mute'}">${mu ? 'Unmute' : 'Mute'}</button><button class="btn sm ${p.banned ? '' : 'danger'}" data-a="ban">${p.banned ? 'Unban' : 'Ban'}</button><button class="btn sm" data-a="admin">${p.is_admin ? 'Unadmin' : 'Admin'}</button><button class="btn sm" data-a="reset">Reset pw</button><button class="btn sm danger" data-a="purge">Purge</button></div>`}</div>`;
      }).join('')}</div>`;
      const qi = body.querySelector('#adQ'); qi.oninput = () => { q = qi.value.trim().toLowerCase(); const pos = qi.selectionStart; draw().then(() => { const n = body.querySelector('#adQ'); n.focus(); n.setSelectionRange(pos, pos); }); };
    } else if (tab === 'channels') {
      const pubs = [...S.channels.values()].filter(c => c.kind === 'public');
      body.innerHTML = `${pubs.map(c => `<div class="urow" data-ch="${c.id}"><span class="hash">#</span><div class="nm">${esc(c.name)}<span class="sub">${esc(c.topic || 'No topic')}</span></div><div class="acts"><button class="btn sm" data-a="open">Open</button><button class="btn sm danger" data-a="delch">Delete</button></div></div>`).join('')}
        <div class="row" style="margin-top:12px"><button class="btn" id="adNewCh">${I.plus} New channel</button></div>`;
      body.querySelector('#adNewCh').onclick = () => { m.close(); $('newChannelBtn').click(); };
    } else {
      body.innerHTML = '<div class="loader"><div class="spin"></div></div>';
      const { data, error } = await sb.rpc('admin_stats');
      if (error || !data) { body.innerHTML = `<p class="hint">${esc(friendly(error))}</p>`; return; }
      const tiles = [['users', 'Accounts'], ['messages', 'Messages'], ['today', 'Last 24h'], ['images', 'Images'], ['channels', 'Channels'], ['groups', 'Groups'], ['dms', 'DM threads'], ['banned', 'Banned'], ['muted', 'Muted now']];
      body.innerHTML = `<div class="stats"><div class="stat"><b>${S.online.size}</b><span>Online now</span></div>${tiles.map(([k, l]) => `<div class="stat"><b>${data[k] ?? 0}</b><span>${l}</span></div>`).join('')}</div>`;
    }
  };
  m.el.querySelector('#adTabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; draw(); } };
  m.draw = draw; adminModal = m; m.onclose = () => { adminModal = null; };
  body.onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const row = b.closest('.urow');
    if (row.dataset.wait) {
      const id = row.dataset.wait, w = S.waiting.get(id), ok = b.dataset.a === 'approve';
      if (!ok && !await confirmBox(`Deny ${w ? w.username : 'them'}?`, 'Their account gets deleted. They can sign up again.', 'Deny')) return;
      const { error } = await sb.rpc('admin_approve', { p_user: id, p_ok: ok });
      if (error) return toast(friendly(error));
      if (ok && w) { S.profiles.set(id, { ...w, approved: true }); rebuildNames(); toast(`${w.username} is in`); }
      else toast('Denied');
      S.waiting.delete(id); renderMe(); renderMembers(); draw(); return;
    }
    if (row.dataset.id) { await adminAction(S.profiles.get(row.dataset.id), b.dataset.a); draw(); return; }
    const c = S.channels.get(row.dataset.ch); if (!c) return;
    if (b.dataset.a === 'open') { m.close(); openChannel(c.id); return; }
    if (!await confirmBox(`Delete #${c.name}?`, 'All messages in it will be gone for good.', 'Delete')) return;
    const { error } = await sb.from('channels').delete().eq('id', c.id);
    if (error) return toast(friendly(error));
    S.channels.delete(c.id); if (S.current === c.id) openChannel(defaultChannel()); renderSidebar(); draw();
  };
  draw();
}

/* settings */
async function uploadAvatar(f){
  const bmp = await loadBitmap(f);
  const size = 256, c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), k = Math.max(size / bmp.width, size / bmp.height), w = bmp.width * k, h = bmp.height * k;
  g.drawImage(bmp, (size - w) / 2, (size - h) / 2, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
  if (!blob) throw new Error('Couldn’t read that image');
  const path = `${S.me.id}/avatar.jpg`;
  const { error } = await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true, cacheControl: '3600' });
  if (error) throw error;
  return sb.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
}
async function setAvatar(url){
  const { error } = await sb.from('profiles').update({ avatar_url: url }).eq('id', S.me.id);
  if (error) throw error;
  S.me = { ...S.me, avatar_url: url }; S.profiles.set(S.me.id, S.me);
  renderMe(); renderMembers(); renderMessages(false);
}
function openEditProfile(){
  const me = S.me; let color = me.color;
  const m = openModal(`<h3>Edit profile</h3><p class="hint">How other people see you.</p>
    <div class="st-av">${avatarHTML(me, 64)}<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" id="stAvBtn" type="button">${me.avatar_url ? 'Change photo' : 'Add photo'}</button>${me.avatar_url ? '<button class="btn sm" id="stAvX" type="button">Remove</button>' : ''}</div><input type="file" id="stAvIn" accept="image/*" hidden></div>
    <label class="field"><span>Display name</span><input class="inp" id="stDisp" value="${esc(me.display_name || '')}" maxlength="32" placeholder="${esc(me.username)}"></label>
    <label class="field"><span>Username <span style="font-weight:400;color:var(--muted)">(for @mentions and login)</span></span><input class="inp" id="stUser" value="${esc(me.username)}" maxlength="20" autocapitalize="off" spellcheck="false"></label>
    <label class="field"><span>Status</span><input class="inp" id="stStatus" value="${esc(me.status || '')}" maxlength="60" placeholder="What are you up to?"></label>
    <label class="field"><span>Bio</span><textarea class="inp" id="stBio" maxlength="190" rows="3" placeholder="Say something about yourself">${esc(me.bio)}</textarea></label>
    <div class="field"><span>Color</span><div class="swatches" id="stColor">${PALETTE.map(c => `<button type="button" class="sw ${c === color ? 'on' : ''}" data-c="${c}" style="--c:${c}"></button>`).join('')}</div></div>
    <div class="err" id="stErr"></div>
    <div class="row spread"><button class="btn" id="stView" type="button">View my profile</button><div class="grp"><button class="btn" data-close>Cancel</button><button class="btn primary" id="stSave">Save</button></div></div>`);
  const q = x => m.el.querySelector(x), err = t => { q('#stErr').textContent = t; };
  q('#stColor').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; color = b.dataset.c; q('#stColor').querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); };
  q('#stView').onclick = () => { m.close(); openProfile(S.me.id); };
  q('#stAvBtn').onclick = () => q('#stAvIn').click();
  q('#stAvIn').onchange = async () => {
    const f = q('#stAvIn').files[0]; q('#stAvIn').value = ''; if (!f) return;
    q('#stAvBtn').disabled = true; q('#stAvBtn').textContent = 'Uploading…';
    try { await setAvatar(await uploadAvatar(f)); m.close(); openEditProfile(); toast('Photo updated'); }
    catch (e) { err(friendly(e)); q('#stAvBtn').disabled = false; q('#stAvBtn').textContent = 'Add photo'; }
  };
  if (q('#stAvX')) q('#stAvX').onclick = async () => {
    try { await sb.storage.from('avatars').remove([`${S.me.id}/avatar.jpg`]); await setAvatar(null); m.close(); openEditProfile(); } catch (e) { err(friendly(e)); }
  };
  q('#stSave').onclick = async () => {
    const name = q('#stUser').value.trim(), bio = q('#stBio').value.trim();
    const display_name = q('#stDisp').value.trim() || null, status = q('#stStatus').value.trim();
    if (!/^[A-Za-z0-9_.]{3,20}$/.test(name)) return err('Usernames are 3 to 20 letters, numbers, _ or .');
    q('#stSave').disabled = true;
    try {
      if (name !== me.username) { const { error } = await sb.rpc('change_username', { p_new: name }); if (error) throw error; }
      if (bio !== me.bio || color !== me.color || display_name !== (me.display_name || null) || status !== (me.status || '')) {
        const { error } = await sb.from('profiles').update({ bio, color, display_name, status }).eq('id', me.id); if (error) throw error;
      }
      S.me = { ...S.me, username: name, bio, color, display_name, status }; S.profiles.set(me.id, S.me); rebuildNames();
      renderMe(); renderMembers(); renderMessages(false); renderHeader();
      m.close(); toast('Profile saved');
    } catch (e) { err(friendly(e)); q('#stSave').disabled = false; }
  };
}

function openSettings(){
  const m = openModal(`<h3>Settings</h3><p class="hint">Notifications, sound, and your account.</p>
    <div class="field"><span>Notifications</span><div class="notif-state"><span class="dotc" id="stNDot"></span><span id="stNText" style="flex:1;font-size:14px;color:var(--ink-2)">Checking…</span><button class="btn sm" type="button" id="stNBtn">Set up</button></div></div>
    <div class="field"><span>Ping sound</span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="seg" id="stSound">${[['all', 'Every message'], ['pings', 'DMs + @mentions'], ['off', 'Off']].map(([v, l]) => `<button type="button" data-v="${v}" class="${soundMode() === v ? 'on' : ''}">${l}</button>`).join('')}</div><button class="btn sm" type="button" id="stTest">Test</button></div></div>
    <div class="divider"></div>
    <label class="field"><span>Change password</span><span class="pw"><input class="inp" id="stPass" type="password" placeholder="New password" autocomplete="new-password"><button class="eye" type="button" data-eye="stPass">${I.eye}</button></span></label>
    <div class="row" style="margin-top:-4px"><button class="btn sm" id="stPassGo" type="button">Update password</button></div>
    <div class="row spread" style="margin-top:14px"><span class="hint" style="margin:0">Recovery key (for a forgotten password)</span><button class="btn sm" id="stKey" type="button">Make a new one</button></div>
    <div class="row spread" style="margin-top:10px"><span class="hint" style="margin:0">How everything works</span><button class="btn sm" id="stGuide" type="button">Open guide</button></div>
    <div class="err" id="stErr" style="margin-top:12px"></div>
    <div class="row spread"><button class="btn danger" id="stOut">Log out</button><button class="btn primary" data-close>Done</button></div>`);
  const q = x => m.el.querySelector(x), err = t => { q('#stErr').textContent = t; };
  q('#stSound').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; LS.set('sound', b.dataset.v); syncPush(); q('#stSound').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  q('#stTest').onclick = () => { unlockAudio(); ping(true); };
  pushState().then(st => {
    const txt = { on: 'On for this device', off: 'Off', blocked: 'Blocked by the browser', install: 'Add to Home Screen first', frame: 'Open Lounge directly to turn on', unsupported: 'Not supported in this browser' }[st];
    q('#stNText').textContent = txt; q('#stNDot').classList.toggle('on', st === 'on');
    q('#stNBtn').textContent = st === 'on' ? 'Manage' : 'Set up';
  });
  q('#stNBtn').onclick = () => { m.close(); openNotifySetup(); };
  q('#stGuide').onclick = () => { m.close(); openGuide(false); };
  q('#stOut').onclick = async () => { m.close(); try { await disablePush(); } catch {} await sb.auth.signOut(); };
  q('#stPassGo').onclick = async () => {
    const pass = q('#stPass').value;
    if (pass.length < 6) return err('Password needs at least 6 characters.');
    q('#stPassGo').disabled = true;
    const { error } = await sb.auth.updateUser({ password: pass });
    q('#stPassGo').disabled = false;
    if (error) return err(friendly(error));
    q('#stPass').value = ''; err(''); toast('Password updated');
  };
  q('#stKey').onclick = async () => {
    if (!await confirmBox('Make a new recovery key?', 'The old one stops working.', 'Make new key')) return;
    const key = genKey();
    const { error } = await sb.rpc('set_recovery_key', { p_key: key });
    if (error) return toast(friendly(error));
    showRecoveryKey(key, false);
  };
}
