<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lounge</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lounge">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#111113">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --sunk:#ebe9e3; --hover:#f6f5f2;
  --ink:#18181b; --ink-2:#48473f; --muted:#8b8982; --line:#e3e1da;
  --accent:#ff5b2e; --accent-2:#d9431a; --accent-soft:#fff0e9;
  --mention:#fff7e8; --mention-line:#f2a93b; --link:#1f5fe0;
  --ok:#1fa35b; --off:#c9c6bd; --danger:#d93025; --ring:rgba(24,24,27,.08);
  --shadow:0 18px 40px -16px rgba(20,20,15,.28),0 2px 6px rgba(20,20,15,.06);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111113; --panel:#18181b; --sunk:#232327; --hover:#1d1d21;
  --ink:#eeede9; --ink-2:#c7c5bf; --muted:#7f7d77; --line:#2a2a2f;
  --accent-soft:#3a1d13; --mention:#2a2214; --link:#7aa7ff; --off:#4a4a50; --ring:rgba(255,255,255,.08);
  --shadow:0 18px 40px -16px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#111113; --panel:#18181b; --sunk:#232327; --hover:#1d1d21;
    --ink:#eeede9; --ink-2:#c7c5bf; --muted:#7f7d77; --line:#2a2a2f;
    --accent-soft:#3a1d13; --mention:#2a2214; --link:#7aa7ff; --off:#4a4a50; --ring:rgba(255,255,255,.08);
    --shadow:0 18px 40px -16px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Geist',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.mono{font-family:'Geist Mono',ui-monospace,monospace}

/* boot */
.boot{position:fixed;inset:0;display:grid;place-items:center}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* brand */
.brand{display:flex;align-items:center;gap:10px}
.mark{width:22px;height:22px;border-radius:7px;background:var(--accent);position:relative;flex:none}
.mark::after{content:'';position:absolute;right:-4px;bottom:-4px;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2.5px solid var(--bg)}
.brand-name{font-weight:650;letter-spacing:-.015em;font-size:16px}

/* auth */
.auth{position:fixed;inset:0;display:grid;place-items:center;padding:24px;overflow:auto}
.auth-card{width:100%;max-width:360px}
.auth .brand{margin-bottom:40px}
.auth h1{font-size:30px;letter-spacing:-.035em;font-weight:650;line-height:1.08}
.auth .sub{color:var(--muted);margin:8px 0 28px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.inp{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--ink-2);box-shadow:0 0 0 3px var(--ring)}
textarea.inp{height:auto;padding:10px 12px;resize:none;line-height:1.45}
.btn{height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--panel);transition:background .15s,transform .06s;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--danger)}
.btn.danger.fill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.wide{width:100%;height:44px;font-size:15px}
.btn[disabled]{opacity:.5;pointer-events:none}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:-2px 0 10px}
.switch{margin-top:20px;font-size:14px;color:var(--muted)}
.link{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;text-decoration-color:var(--line)}
.link:hover{text-decoration-color:var(--ink)}

/* layout */
.app{display:grid;grid-template-columns:264px minmax(0,1fr) 236px;height:100%;height:100dvh}
.app.no-members{grid-template-columns:264px minmax(0,1fr)}
.app.no-members .members{display:none}
.scrim{display:none}

/* sidebar */
.side{background:var(--bg);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.side-head{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px 0 18px;flex:none}
.fr-btn{position:relative;margin-left:2px}
.fr-btn .badge{position:absolute;top:1px;right:0;min-width:17px;height:17px;font-size:10px;padding:0 4px;border:2px solid var(--bg)}
.tag.ok{background:var(--ok);color:#fff}
.fr-row{margin-top:6px;font-weight:600}
.fr-row .fr-n{font-size:12px;color:var(--muted);font-family:'Geist Mono',monospace}
.online-pill{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.online-pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.side-scroll{flex:1;overflow-y:auto;padding:0 10px 12px}
.sec{margin-top:16px}
.sec:first-child{margin-top:6px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 6px 6px 8px;font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-add{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.sec-add:hover{background:var(--sunk);color:var(--ink)}
.ch{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 8px;border-radius:9px;color:var(--ink-2);text-align:left;position:relative}
.ch:hover{background:var(--sunk);color:var(--ink)}
.ch.active{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04)}
.ch.unread{color:var(--ink);font-weight:650}
.ch.unread::before{content:'';position:absolute;left:-10px;top:50%;width:4px;height:8px;margin-top:-4px;border-radius:0 4px 4px 0;background:var(--ink)}
.ch .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hash{width:22px;text-align:center;font-family:'Geist Mono',monospace;color:var(--muted);font-size:16px;flex:none}
.gicon{width:22px;height:22px;display:grid;place-items:center;color:var(--muted);flex:none}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:650;display:grid;place-items:center;font-family:'Geist Mono',monospace}
.empty-sec{padding:4px 8px;font-size:13px;color:var(--muted)}
.me{flex:none;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;margin:0 10px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.me .who{flex:1;min-width:0;cursor:pointer}
.me .nm{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .st{font-size:12px;color:var(--muted)}

/* avatars */
.av{--s:32px;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .32);background:var(--c);color:#fff;display:inline-grid;place-items:center;font-weight:650;font-size:calc(var(--s) * .44);flex:none;position:relative;cursor:pointer;user-select:none;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.av .dot{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--off);border:2.5px solid var(--bg)}
.av .dot.on{background:var(--ok)}
.main .av .dot,.modal .av .dot{border-color:var(--panel)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);position:relative}
.top{height:58px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 20px;border-bottom:1px solid var(--line)}
.top-title{flex:1;min-width:0;display:flex;align-items:center;gap:14px}
.t-name{font-weight:650;font-size:16px;letter-spacing:-.015em;white-space:nowrap;display:flex;align-items:center;gap:8px;min-width:0}
.t-name .hash{width:auto;font-size:18px}
.t-topic{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:14px;border-left:1px solid var(--line)}
.t-topic:empty{display:none}
.icon-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn.on{background:var(--sunk);color:var(--ink)}
.only-mobile{display:none}

.msgs{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msgs-inner{padding:8px 0 10px;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.intro{padding:32px 20px 12px}
.intro .big{width:60px;height:60px;border-radius:18px;background:var(--sunk);display:grid;place-items:center;font-size:30px;font-family:'Geist Mono',monospace;color:var(--ink-2);margin-bottom:16px}
.intro h2{font-size:26px;letter-spacing:-.035em;font-weight:650;line-height:1.15}
.intro p{color:var(--muted);margin-top:6px;max-width:520px}
.loader{padding:18px;display:grid;place-items:center}
.day{display:flex;align-items:center;gap:12px;margin:20px 20px 4px;font-size:11.5px;font-weight:600;color:var(--muted);font-family:'Geist Mono',monospace;letter-spacing:.02em}
.day::before,.day::after{content:'';flex:1;height:1px;background:var(--line)}

.msg{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);padding:6px 20px 3px 10px;margin-top:8px}
.msg.compact{margin-top:0;padding-top:1px;padding-bottom:2px}
.msg:hover,.msg.sel{background:var(--hover)}
.msg.mention{background:var(--mention);box-shadow:inset 3px 0 0 var(--mention-line)}
.msg.pending{opacity:.5}
.msg.flash{animation:flash 1.6s ease}
@keyframes flash{0%,35%{background:var(--accent-soft)}}
.gutter{display:flex;justify-content:center;padding-top:2px}
.msg.compact .gutter time{opacity:0;font-size:10.5px;color:var(--muted);font-family:'Geist Mono',monospace;padding-top:4px;white-space:nowrap}
.msg.compact:hover .gutter time,.msg.compact.sel .gutter time{opacity:1}
.meta{display:flex;align-items:baseline;gap:8px;margin-bottom:1px;min-width:0}
.name{font-weight:650;font-size:15px;letter-spacing:-.01em}
.name:hover{text-decoration:underline;text-underline-offset:2px}
.meta time{font-size:12px;color:var(--muted);white-space:nowrap}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--ink);color:var(--bg);align-self:center;line-height:1.2}
.tag.danger{background:var(--danger);color:#fff}
.text{overflow-wrap:anywhere}
.text a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.text code{font-family:'Geist Mono',monospace;font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:5px}
.text pre{font-family:'Geist Mono',monospace;font-size:13px;background:var(--sunk);padding:10px 12px;border-radius:9px;margin:4px 0;white-space:pre-wrap;overflow-x:auto}
.text blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--ink-2)}
.mn{background:var(--accent-soft);color:var(--accent-2);font-weight:600;border-radius:5px;padding:0 3px;cursor:pointer}
[data-theme="dark"] .mn{color:#ff9a7a}
.edited{font-size:11px;color:var(--muted)}
.silent{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:1px}
.att{display:block;max-width:min(380px,100%);max-height:340px;border-radius:12px;margin-top:6px;border:1px solid var(--line);cursor:zoom-in;background:var(--sunk)}
.reply-ref{grid-column:2;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:3px;cursor:pointer;min-width:0;white-space:nowrap;position:relative}
.reply-ref::before{content:'';position:absolute;left:-38px;top:9px;width:30px;height:12px;border-left:2px solid var(--line);border-top:2px solid var(--line);border-top-left-radius:7px}
.reply-ref .rn{font-weight:650;color:var(--ink-2);flex:none}
.reply-ref .rt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.reply-ref:hover .rt{color:var(--ink)}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rc{height:26px;padding:0 8px;border-radius:13px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:5px;font-size:13px;transition:transform .1s}
.rc:active{transform:scale(.94)}
.rc b{font-weight:600;font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink-2)}
.rc.mine{border-color:var(--accent);background:var(--accent-soft)}
.rc.mine b{color:var(--accent-2)}
.rc:hover{border-color:var(--ink-2)}
.tools{position:absolute;right:16px;top:-16px;display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:var(--shadow);z-index:2}
.msg:hover .tools,.msg.sel .tools{display:flex}
.tools button{width:32px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2);font-size:15px}
.tools button:hover{background:var(--hover);color:var(--ink)}
.tools .del:hover{color:var(--danger)}
@media (hover:none){
  .msg{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .msg:hover{background:none}
  .msg.mention:hover{background:var(--mention)}
  .msg:hover .tools{display:none}
  .msg.sel{background:var(--hover)}
  .msg.sel .tools{display:flex}
}

/* composer */
.composer-wrap{flex:none;padding:0 20px 16px;position:relative}
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 6px);height:32px;padding:0 14px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:3}
.typing{height:24px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;padding-left:4px;white-space:nowrap;overflow:hidden}
.typing b{color:var(--ink-2);font-weight:650}
.tdots{display:inline-flex;gap:3px}
.tdots i{width:4px;height:4px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.tdots i:nth-child(2){animation-delay:.15s}
.tdots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-3px);opacity:1}}
.composer{border:1px solid var(--line);border-radius:14px;background:var(--panel);transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--ink-2);box-shadow:0 0 0 3px var(--ring)}
.comp-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.comp-bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-bar b{color:var(--ink);font-weight:650}
.comp-img{padding:10px 12px 0;position:relative;display:inline-block}
.comp-img img{height:90px;max-width:220px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}
.comp-img button{position:absolute;top:4px;right:2px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.comp-row{display:flex;align-items:flex-end;gap:4px;padding:5px}
.comp-row textarea{flex:1;border:0;outline:0;background:none;resize:none;max-height:180px;padding:8px 6px;line-height:1.45;font-size:15px;min-width:0}
.comp-row textarea::placeholder{color:var(--muted)}
.send{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:opacity .15s,transform .1s}
.send:disabled{opacity:.3;cursor:default}
.send:not(:disabled):active{transform:scale(.93)}
.banned-note{padding:14px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);font-size:14px}
.mention-list{position:absolute;left:20px;right:20px;bottom:calc(100% - 22px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px;z-index:4;max-width:360px}
.mention-list button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:8px;text-align:left;font-weight:550}
.mention-list button.on{background:var(--sunk)}

/* members */
.members{background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;min-width:0}
.members-inner{padding:12px 10px 20px}
.mem-h{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px 6px;margin-top:16px}
.mem{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:9px;text-align:left}
.mem:hover{background:var(--sunk)}
.mem.off{opacity:.5}
.mem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550;font-size:14px}
.mem .tag{font-size:9px;padding:2px 5px}

/* popovers, modals */
.picker{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:grid;grid-template-columns:repeat(8,36px);gap:2px;animation:pop .14s ease}
.picker button{width:36px;height:36px;border-radius:9px;font-size:20px;display:grid;place-items:center}
.picker button:hover{background:var(--sunk)}
.picker .pk-x{color:var(--muted)}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(15,15,12,.38);display:grid;place-items:center;padding:16px;animation:fade .15s ease}
.modal{width:100%;max-width:420px;max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:22px;animation:pop .2s cubic-bezier(.2,.9,.3,1.15)}
.modal h3{font-size:19px;font-weight:650;letter-spacing:-.025em;margin-bottom:4px}
.modal .hint{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal .row.spread{justify-content:space-between}
.modal .row .grp{display:flex;gap:8px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
.pick-list{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:8px}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;text-align:left;font-weight:550;font-size:14px}
.pick:hover{background:var(--hover)}
.pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.pick.on .chk{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick-empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:10px;background:var(--c);position:relative}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}

<div class="boot" id="boot"><div class="spin"></div></div>

      <button class="btn primary wide" id="authBtn" type="submit">Log in</button>
    </form>
    <p class="switch"><span id="authSwitchText">New here?</span> <button class="link" id="authSwitch" type="button">Create an account</button></p>
    <p class="switch" id="forgotRow" style="margin-top:10px"><button class="link" id="forgotBtn" type="button">Forgot password?</button></p>
  </div>
</section>

<div class="app hidden" id="app">
  <aside class="side" id="side">
    <div class="side-head"><div class="brand"><span class="mark"></span><span class="brand-name" data-appname></span></div><span class="online-pill mono" id="onlinePill">0</span></div>
    <div class="side-scroll">
      <button class="ch fr-row" id="friendsBtn" type="button"></button>
      <div class="sec"><div class="sec-h"><span>Channels</span><button class="sec-add" id="newChannelBtn" title="New channel"></button></div><div id="listPublic"></div></div>
      <div class="sec"><div class="sec-h"><span>Groups</span><button class="sec-add" id="newGroupBtn" title="New group"></button></div><div id="listGroup"></div></div>
      <div class="sec"><div class="sec-h"><span>Direct messages</span><button class="sec-add" id="newDmBtn" title="New message"></button></div><div id="listDm"></div></div>
    </div>
    <div class="me" id="meBar"></div>
  </aside>

  <main class="main" id="main">
    <header class="top">
      <button class="icon-btn only-mobile" id="menuBtn" title="Channels"></button>
      <div class="top-title"><div class="t-name" id="chName"></div><div class="t-topic" id="chTopic"></div></div>
      <button class="icon-btn" id="helpBtn" title="How it works"></button>
      <button class="icon-btn" id="chSettingsBtn" title="Channel settings"></button>
      <button class="icon-btn" id="membersBtn" title="Members"></button>
    </header>
    <div class="pushbar hidden" id="pushBar"><span>🔔 Get pinged even when the chat is closed.</span><button class="btn sm primary" id="pushBarGo" type="button">Set up</button><button class="x" id="pushBarX" type="button" title="Hide"></button></div>
    <div class="msgs" id="msgs"><div class="msgs-inner" id="msgsInner"></div></div>
    <div class="composer-wrap">
      <button class="jump hidden" id="jumpBtn">New messages ↓</button>
      <div class="mention-list hidden" id="mentionList"></div>
      <div class="typing" id="typing"></div>
      <div class="composer" id="composer">
        <div class="comp-bar hidden" id="compBar"><span id="compBarText"></span><button class="link" id="compBarX" type="button">Cancel</button></div>
        <div class="comp-img hidden" id="compImg"><img id="compImgEl" alt=""><button id="compImgX" type="button" title="Remove"></button></div>
        <div class="comp-row">
          <button class="icon-btn" id="attachBtn" title="Add image" type="button"></button>
          <input type="file" id="fileIn" accept="image/*" hidden>
          <textarea id="input" rows="1" placeholder="Message" maxlength="2000"></textarea>
          <button class="send" id="sendBtn" title="Send" type="button" disabled></button>
        </div>
      </div>
      <div class="banned-note hidden" id="bannedNote">You've been banned, so you can read but not send.</div>
    </div>
  </main>

  <aside class="members" id="members"><div class="members-inner" id="membersInner"></div></aside>
  <div class="scrim" id="scrim"></div>
</div>

  if (/rate limit|too many/i.test(m)) return 'Too many tries. Wait a minute and try again.';
  if (/Password should/i.test(m)) return 'Password needs at least 6 characters.';
  if (/signups.*disabled/i.test(m)) return 'Signups are turned off in Supabase.';
  if (/Wrong username or recovery key/i.test(m)) return 'Wrong username or recovery key.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Can\u2019t reach the server. Check your connection.';
  return m || 'Something went wrong.';
}

const PUSH = (() => {
  let inFrame = false; try { inFrame = window.top !== window.self; } catch { inFrame = true; }
  const ua = navigator.userAgent;
  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && (location.protocol === 'https:' || location.hostname === 'localhost');
  return { inFrame, ios, standalone, supported, reg: null };
})();
const b64ToBytes = b => { const p = '='.repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
async function swReady(){
  if (!PUSH.supported || PUSH.inFrame) return null;
  if (!PUSH.reg) { try { PUSH.reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready; } catch { return null; } }
  return PUSH.reg;
}
async function pushState(){
  if (PUSH.inFrame) return 'frame';
  if (PUSH.ios && !PUSH.standalone) return 'install';
  if (!PUSH.supported) return 'unsupported';
  if (Notification.permission === 'denied') return 'blocked';
  const reg = await swReady(); if (!reg) return 'unsupported';
  const sub = await reg.pushManager.getSubscription();
  return sub && Notification.permission === 'granted' ? 'on' : 'off';
}
async function saveSub(sub){
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_sub', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_mode: soundMode() === 'all' ? 'all' : 'pings' });
  if (error) throw error;
}
async function enablePush(){
  const reg = await swReady(); if (!reg) throw new Error('Notifications aren’t supported here');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Notifications are blocked. Allow them in your browser settings.' : 'You need to tap Allow');
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
  await saveSub(sub);
}
async function disablePush(){
  const reg = await swReady(); if (!reg) return;
  const sub = await reg.pushManager.getSubscription(); if (!sub) return;
  await sb.from('push_subs').delete().eq('endpoint', sub.endpoint);
  await sub.unsubscribe().catch(() => {});
}
async function syncPush(){
  // re-link this device to whoever is logged in, keep mode in sync
  try {
    if ((await pushState()) !== 'on') return;
    await saveSub(await PUSH.reg.pushManager.getSubscription());
  } catch {}
}

}

function teardown(){
  if (S.rt) sb.removeChannel(S.rt);
  if (S.live) sb.removeChannel(S.live);
  Object.assign(S, { me: null, rt: null, live: null, current: null, pending: [], reply: null, editing: null, file: null });
  [S.friends, S.waiting, S.profiles, S.channels, S.members, S.msgs, S.byId, S.reacts, S.unread, S.lastAt, S.typing].forEach(m => m.clear());
  S.online.clear();
  closeModals(); setAuthMode('login'); show('auth');
}

function defaultChannel(){
  const pubs = [...S.channels.values()].filter(c => c.kind === 'public');
  return (pubs.find(c => c.name === 'general') || pubs[0] || [...S.channels.values()][0])?.id || null;
}

/* ---------- data loading ---------- */
async function loadProfiles(){
  const { data, error } = await sb.from('profiles').select('*');
  if (error) throw error;
  S.profiles.clear(); S.waiting.clear();
  const meId = (await sb.auth.getSession()).data.session?.user.id;
  for (const p of data) (p.approved === false && p.id !== meId ? S.waiting : S.profiles).set(p.id, p);
  rebuildNames();
}
function rebuildNames(){ S.nameIdx.clear(); for (const p of S.profiles.values()) S.nameIdx.set(p.username.toLowerCase(), p); }

async function loadChannels(){
  const [a, b] = await Promise.all([
    sb.from('channels').select('*').order('created_at'),
    sb.from('channel_members').select('channel_id,user_id')
  ]);
  if (a.error) throw a.error;
  S.channels.clear(); S.members.clear();
  for (const c of a.data) S.channels.set(c.id, c);
  for (const m of b.data || []) addMember(m.channel_id, m.user_id);
  renderSidebar();
}
function addMember(ch, u){ if (!S.members.has(ch)) S.members.set(ch, new Set()); S.members.get(ch).add(u); }

async function ensureChannel(id){
  if (S.channels.has(id)) return true;
  const [a, b] = await Promise.all([
    sb.from('channels').select('*').eq('id', id).maybeSingle(),
    sb.from('channel_members').select('channel_id,user_id').eq('channel_id', id)
  ]);
  if (!a.data) return false;
  S.channels.set(id, a.data);
  for (const m of b.data || []) addMember(m.channel_id, m.user_id);
  renderSidebar();
  return true;
}

async function refreshState(){
  const { data } = await sb.rpc('channel_state');
  S.unread.clear();
  for (const r of data || []) {
    S.unread.set(r.channel_id, { unread: r.unread, mentions: r.mentions });
    if (r.last_at) S.lastAt.set(r.channel_id, r.last_at);
  }
  if (S.current && !document.hidden) S.unread.delete(S.current);
  renderSidebar(); updateTitle();
}

async function loadMessages(ch, older){
  const list = S.msgs.get(ch) || [];
  let q = sb.from('messages').select('*').eq('channel_id', ch).order('id', { ascending: false }).limit(PAGE);
  if (older && list.length) q = q.lt('id', list[0].id);
  const { data, error } = await q;
  if (error) { toast('Couldn\u2019t load messages'); return; }
  const rows = data.reverse();
  S.hasMore.set(ch, data.length === PAGE);
  for (const m of rows) S.byId.set(m.id, m);
  S.msgs.set(ch, older ? rows.concat(list) : rows);
  if (!rows.length) return;
  const ids = rows.map(m => m.id);
  const missing = [...new Set(rows.map(m => m.reply_to).filter(r => r && !S.byId.has(r)))];
  const [rx, rp] = await Promise.all([
    sb.from('reactions').select('message_id,user_id,emoji').in('message_id', ids),
    missing.length ? sb.from('messages').select('*').in('id', missing) : Promise.resolve({ data: [] })
  ]);
  for (const id of ids) S.reacts.delete(id);
  for (const r of rx.data || []) applyReact(r.message_id, r.user_id, r.emoji, true);
  for (const m of rp.data || []) S.byId.set(m.id, m);
}

/* ---------- realtime ---------- */
function subscribe(){
  if (S.rt) sb.removeChannel(S.rt);
  if (S.live) sb.removeChannel(S.live);
  S.rt = sb.channel('db')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, onMsg)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reactions' }, onReact)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'channels' }, onChannel)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'channel_members' }, onMember)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, onProfile)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, onFriendship)
    .subscribe(st => {
      if (st === 'SUBSCRIBED') { if (S.rtDown) { S.rtDown = false; catchUp(); } }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') S.rtDown = true;
    });
  S.live = sb.channel('live', { config: { presence: { key: S.me.id }, broadcast: { self: false } } })
    .on('presence', { event: 'sync' }, () => { S.online = new Set(Object.keys(S.live.presenceState())); renderPresence(); })
    .on('broadcast', { event: 'typing' }, ({ payload }) => onTyping(payload))
    .subscribe(async st => { if (st === 'SUBSCRIBED') await S.live.track({ at: Date.now() }); });
}

async function catchUp(){
  if (!S.me) return;
  try {
    await Promise.all([loadProfiles(), loadChannels(), loadFriends()]);
    S.me = S.profiles.get(S.me.id) || S.me;
    for (const k of [...S.msgs.keys()]) if (k !== S.current) S.msgs.delete(k);
    if (S.current && S.channels.has(S.current)) { await loadMessages(S.current); renderMessages(S.nearBottom); }
    else await openChannel(defaultChannel());
    await refreshState();
    renderMe(); renderHeader(); renderMembers(); applyRestrictions();
  } catch {}
}

document.addEventListener('visibilitychange', () => {
  if (!S.me) return;
  if (document.hidden) { S.hiddenAt = Date.now(); return; }
  if (Date.now() - S.hiddenAt > 45000) catchUp();
  else if (S.current && S.nearBottom) markRead(S.current);
});

function onMsg({ eventType, new: n, old: o }){
  if (eventType === 'INSERT') {
    S.lastAt.set(n.channel_id, n.created_at);
    clearTyping(n.channel_id, n.user_id);
    const pos = addMessage(n);
    if (n.reply_to && !S.byId.has(n.reply_to)) {
      sb.from('messages').select('*').eq('id', n.reply_to).maybeSingle().then(({ data }) => { if (data) { S.byId.set(data.id, data); patchMsg(n.id); } });
    }
    const here = n.channel_id === S.current;
    if (here && pos) {
      if (pos === 'end') domInsertTail(n); else renderMessages(false);
      if (n.user_id === S.me.id || S.nearBottom) scrollBottom(); else $('jumpBtn').classList.remove('hidden');
    }
    if (n.user_id !== S.me.id) {
      const c = S.channels.get(n.channel_id);
      const mention = mentionsMe(n.content), silent = /^@silent\b/i.test(n.content || '');
      const watching = here && !document.hidden && S.nearBottom;
      if (watching) markRead(n.channel_id);
      else {
        const u = S.unread.get(n.channel_id) || { unread: 0, mentions: 0 };
        u.unread++;
        if (mention) u.mentions++;
        S.unread.set(n.channel_id, u);
      }
      const mode = soundMode();
      const wants = mode === 'all' || (mode === 'pings' && (mention || (c && c.kind !== 'public')));
      if (wants && !silent) ping();
    }
    renderSidebar(); updateTitle();
  } else if (eventType === 'UPDATE') {
    const old = S.byId.get(n.id);
    S.byId.set(n.id, n);
    const list = S.msgs.get(n.channel_id);
    if (list) { const i = list.findIndex(m => m.id === n.id); if (i >= 0) list[i] = n; }
    if (old || list) patchMsg(n.id);
  } else if (eventType === 'DELETE') {
    removeMessage(o.id);
  }
}

function addMessage(m){
  S.byId.set(m.id, m);
  const list = S.msgs.get(m.channel_id);
  if (!list) return false;
  if (list.some(x => x.id === m.id)) return false;
  let i = list.length;
  while (i > 0 && list[i - 1].id > m.id) i--;
  list.splice(i, 0, m);
  return i === list.length - 1 ? 'end' : 'mid';
}

function removeMessage(id){
  const m = S.byId.get(id);
  S.byId.delete(id); S.reacts.delete(id);
  for (const [ch, list] of S.msgs) {
    const i = list.findIndex(x => x.id === id);
    if (i >= 0) { list.splice(i, 1); if (ch === S.current) renderMessages(false); }
  }
  // refresh replies that pointed at it
  if (m && S.current) for (const x of S.msgs.get(S.current) || []) if (x.reply_to === id) patchMsg(x.id);
}

function applyReact(mid, uid, emoji, on){
  if (!S.reacts.has(mid)) S.reacts.set(mid, new Map());
  const byE = S.reacts.get(mid);
  if (!byE.has(emoji)) byE.set(emoji, new Set());
  const set = byE.get(emoji);
  if (on) set.add(uid); else set.delete(uid);
  if (!set.size) byE.delete(emoji);
}
function onReact({ eventType, new: n, old: o }){
  const r = eventType === 'DELETE' ? o : n;
  if (!r || !r.message_id) return;
  if (!S.byId.has(r.message_id)) return;
  applyReact(r.message_id, r.user_id, r.emoji, eventType !== 'DELETE');
  patchMsg(r.message_id);
}

function onChannel({ eventType, new: n, old: o }){
  if (eventType === 'DELETE') {
    if (!S.channels.has(o.id)) return;
    S.channels.delete(o.id); S.msgs.delete(o.id); S.unread.delete(o.id);
    if (S.current === o.id) { toast('That channel was deleted'); openChannel(defaultChannel()); }
    renderSidebar(); return;
  }
  if (n.kind !== 'public' && !(S.members.get(n.id)?.has(S.me.id))) { if (eventType === 'UPDATE' && S.channels.has(n.id)) S.channels.set(n.id, n); else return; }
  S.channels.set(n.id, n);
  renderSidebar();
  if (n.id === S.current) renderHeader();
}

async function onMember({ eventType, new: n, old: o }){
  if (eventType === 'INSERT') {
    addMember(n.channel_id, n.user_id);
    if (n.user_id === S.me.id && !S.channels.has(n.channel_id)) await ensureChannel(n.channel_id);
  } else if (eventType === 'DELETE') {
    S.members.get(o.channel_id)?.delete(o.user_id);
    if (o.user_id === S.me.id && S.channels.get(o.channel_id)?.kind === 'group') {
      S.channels.delete(o.channel_id); S.msgs.delete(o.channel_id);
      if (S.current === o.channel_id) openChannel(defaultChannel());
    }
  }
  renderSidebar();
  const id = (n && n.channel_id) || (o && o.channel_id);
  if (id === S.current) { renderHeader(); renderMembers(); }
}

function onProfile({ eventType, new: n, old: o }){
  if (eventType === 'DELETE') {
    const id = o && o.id; if (!id) return;
    S.waiting.delete(id); S.profiles.delete(id); rebuildNames(); renderMe(); renderMembers(); if (adminModal) adminModal.draw(); return;
  }
  if (!n) return;
  if (n.approved === false && n.id !== S.me?.id) {
    const isNew = !S.waiting.has(n.id);
    S.waiting.set(n.id, n); S.profiles.delete(n.id);
    if (isNew && S.me?.is_admin) { toast(`${n.username} is in the waiting room`); ping(); }
    renderMe(); if (adminModal) adminModal.draw();
    return;
  }
  if (S.waiting.delete(n.id) && adminModal) adminModal.draw();
  S.profiles.set(n.id, n); rebuildNames();
  if (S.me && n.id === S.me.id) {
    const wasAdmin = S.me.is_admin; S.me = n; renderMe(); applyRestrictions();
    if (wasAdmin !== n.is_admin) renderHeader();
  }
  renderSidebar(); renderMembers(); renderHeader();
  if (eventType === 'UPDATE' && S.current) renderMessages(false);
}

/* ---------- typing ---------- */
function sendTyping(){
  const now = Date.now();
  if (!S.live || now - S.lastTypingSent < 2500) return;
  S.lastTypingSent = now;
  S.live.send({ type: 'broadcast', event: 'typing', payload: { u: S.me.id, c: S.current } });
}
function onTyping(p){
  if (!p || !S.channels.has(p.c) || p.u === S.me?.id) return;
  if (!S.typing.has(p.c)) S.typing.set(p.c, new Map());
  const m = S.typing.get(p.c);
  clearTimeout(m.get(p.u));
  m.set(p.u, setTimeout(() => { m.delete(p.u); renderTyping(); }, 4000));
  renderTyping();
}
function clearTyping(c, u){ const m = S.typing.get(c); if (m && m.has(u)) { clearTimeout(m.get(u)); m.delete(u); renderTyping(); } }
function renderTyping(){
  const m = S.typing.get(S.current);
  const names = m ? [...m.keys()].map(id => dn(S.profiles.get(id))).filter(Boolean) : [];
  if (!names.length) { $('typing').innerHTML = ''; return; }
  const who = names.length === 1 ? `<b>${esc(names[0])}</b> is typing`
    : names.length === 2 ? `<b>${esc(names[0])}</b> and <b>${esc(names[1])}</b> are typing`
    : 'Several people are typing';
  $('typing').innerHTML = `<span class="tdots"><i></i><i></i><i></i></span><span>${who}</span>`;
}

/* ---------- read state ---------- */
function markRead(ch){
  if (!ch) return;
  if (S.unread.has(ch)) { S.unread.delete(ch); renderSidebar(); updateTitle(); }
  clearTimeout(S.readTimers.get(ch));
  S.readTimers.set(ch, setTimeout(() => { S.readTimers.delete(ch); sb.rpc('mark_read', { ch }).then(() => {}, () => {}); }, 300));
}
function updateTitle(){
  let n = 0;
  for (const [id, u] of S.unread) { const c = S.channels.get(id); if (!c) continue; n += c.kind === 'public' ? u.mentions : u.unread; }
  document.title = n ? `(${n}) ${APP_NAME}` : APP_NAME;
  try { if (navigator.setAppBadge) n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch {}
}
let actx;
function soundMode(){ const v = LS.get('sound', true); return v === true ? 'pings' : v === false ? 'off' : v; }
try { if (navigator.audioSession) navigator.audioSession.type = 'transient'; } catch {}
function unlockAudio(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
    // iOS only unlocks audio after something plays during a tap
    const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
    src.buffer = b; src.connect(actx.destination); src.start(0);
  } catch {}
}
// keep re-unlocking: iOS suspends audio when the tab is backgrounded
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (!actx || actx.state !== 'running') unlockAudio(); }, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && actx && actx.state !== 'running') actx.resume().catch(() => {}); });
function ping(force){
  if (!force && soundMode() === 'off') return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(740, t); o.frequency.exponentialRampToValueAtTime(1180, t + .07);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.11, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .28);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .3);
  } catch {}
}

/* ---------- rendering: people ---------- */
function avatarHTML(u, size = 32, dot = false){
  const letter = esc((dn(u) || '?')[0].toUpperCase());
  const pic = u && u.avatar_url && u.avatar_url.startsWith(AV_PREFIX) ? `<img src="${esc(u.avatar_url)}" alt="" loading="lazy">` : letter;
  const d = dot && u ? `<i class="dot ${S.online.has(u.id) ? 'on' : ''}"></i>` : '';
  return `<span class="av" data-user="${u ? u.id : ''}" style="--c:${safeColor(u && u.color)};--s:${size}px">${pic}${d}</span>`;
}
function dmOther(c){
  const set = S.members.get(c.id);
  if (set) for (const id of set) if (id !== S.me.id) return S.profiles.get(id) || null;
  return S.me;
}
function chLabel(c){ return c.kind === 'dm' ? (dn(dmOther(c)) || 'Unknown') : (c.name || 'Untitled'); }

function renderMe(){
  if (!S.me) return;
  $('meBar').innerHTML = `${avatarHTML(S.me, 34, true)}<div class="who" id="meWho"><div class="nm">${esc(dn(S.me))}</div><div class="st">${S.me.banned ? 'Banned' : isMuted() ? 'Muted' : S.me.status ? esc(S.me.status) : S.me.is_admin ? 'Admin' : 'Online'}</div></div>${S.me.is_admin ? `<button class="icon-btn fr-btn" id="adminBtn" title="Admin panel">${I.shield}${S.waiting.size ? `<span class="badge">${S.waiting.size}</span>` : ''}</button>` : ''}<button class="icon-btn" id="profileBtn" title="Edit profile">${I.person}</button><button class="icon-btn" id="settingsBtn" title="Settings">${I.gearCog}</button>`;
  $('profileBtn').onclick = openEditProfile;
  $('settingsBtn').onclick = openSettings;
  if (S.me.is_admin) $('adminBtn').onclick = openAdmin;
  $('meWho').onclick = () => openProfile(S.me.id);
  $('newChannelBtn').classList.toggle('hidden', !S.me.is_admin);
}
function isMuted(u = S.me){ return !!(u && u.muted_until && new Date(u.muted_until) > new Date()); }
let restrictTimer;
function applyRestrictions(){
  clearTimeout(restrictTimer);
  const b = !!S.me?.banned, mu = !b && isMuted();
  $('composer').classList.toggle('hidden', b || mu);
  $('bannedNote').classList.toggle('hidden', !(b || mu));
  if (b) $('bannedNote').textContent = 'You\u2019ve been banned, so you can read but not send.';
  else if (mu) {
    const left = new Date(S.me.muted_until) - Date.now();
    $('bannedNote').textContent = `You\u2019re muted for another ${fmtMins(Math.max(1, Math.ceil(left / 60000)))}.`;
    restrictTimer = setTimeout(applyRestrictions, Math.min(60000, left + 500));
  }
  if (S.current && S.msgs.has(S.current)) renderMessages(false);
}
function canDelete(m){ return S.me.is_admin || (m.user_id === S.me.id && Date.now() - new Date(m.created_at) < DELETE_WINDOW); }

function renderSidebar(){
  if (!S.me) return;
  const all = [...S.channels.values()];
  const byAct = (a, b) => (S.lastAt.get(b.id) || b.created_at).localeCompare(S.lastAt.get(a.id) || a.created_at);
  const pub = all.filter(c => c.kind === 'public');
  const grp = all.filter(c => c.kind === 'group').sort(byAct);
  const dms = all.filter(c => c.kind === 'dm').sort(byAct);
  $('listPublic').innerHTML = pub.map(chItem).join('') || '<div class="empty-sec">No channels yet</div>';
  $('listGroup').innerHTML = grp.map(chItem).join('') || '<div class="empty-sec">No groups yet</div>';
  $('listDm').innerHTML = dms.map(chItem).join('') || '<div class="empty-sec">No DMs yet</div>';
}
function chItem(c){
  const u = S.unread.get(c.id);
  const n = u ? (c.kind === 'public' ? u.mentions : u.unread) : 0;
  const icon = c.kind === 'public' ? '<span class="hash">#</span>'
    : c.kind === 'group' ? `<span class="gicon">${I.group}</span>`
    : avatarHTML(dmOther(c), 22, true).replace('data-user=', 'data-x=');
  const cls = ['ch', c.id === S.current ? 'active' : '', u && u.unread && c.id !== S.current ? 'unread' : ''].join(' ');
  return `<button class="${cls}" data-ch="${c.id}">${icon}<span class="lbl">${esc(chLabel(c))}</span>${n && c.id !== S.current ? `<span class="badge">${n > 99 ? '99+' : n}</span>` : ''}</button>`;
}
$('side').addEventListener('click', e => {
  const b = e.target.closest('[data-ch]');
  if (b) openChannel(b.dataset.ch);
});

function renderHeader(){
  const c = S.channels.get(S.current);
  if (!c || !S.me) return;
  let name, topic = '';
  if (c.kind === 'public') { name = `<span class="hash">#</span><span>${esc(c.name)}</span>`; topic = esc(c.topic || ''); }
  else if (c.kind === 'group') { name = `<span class="gicon">${I.group}</span><span>${esc(c.name)}</span>`; topic = `${(S.members.get(c.id) || new Set()).size} members`; }

  $('chName').innerHTML = name; $('chTopic').innerHTML = topic;

  $('input').placeholder = c.kind === 'public' ? `Message #${c.name}` : c.kind === 'group' ? `Message ${c.name}` : `Message @${dmOther(c)?.username || ''}`;

}
$('chName').addEventListener('click', e => { const a = e.target.closest('[data-user]'); if (a) openProfile(a.dataset.user); });

function renderMembers(){
  const c = S.channels.get(S.current);
  if (!c || !S.me) return;
  let ids = c.kind === 'public' ? [...S.profiles.keys()] : [...(S.members.get(c.id) || [])];
  ids = ids.filter(id => S.profiles.has(id));
  const byName = (a, b) => S.profiles.get(a).username.localeCompare(S.profiles.get(b).username, undefined, { sensitivity: 'base' });
  const on = ids.filter(id => S.online.has(id)).sort(byName), off = ids.filter(id => !S.online.has(id)).sort(byName);
  const row = (id, isOn) => { const p = S.profiles.get(id);
    return `<button class="mem ${isOn ? '' : 'off'}" data-user="${id}">${avatarHTML(p, 30, true)}<span class="nm">${esc(dn(p))}</span>${p.is_admin ? '<span class="tag">admin</span>' : ''}${p.banned && S.me.is_admin ? '<span class="tag danger">ban</span>' : isMuted(p) && S.me.is_admin ? '<span class="tag">muted</span>' : ''}</button>`; };
  $('membersInner').innerHTML =
    `<div class="mem-h" style="margin-top:6px">Online · ${on.length}</div>${on.map(id => row(id, true)).join('')}` +
    (off.length ? `<div class="mem-h">Offline · ${off.length}</div>${off.map(id => row(id, false)).join('')}` : '');
}

/* ---------- rendering: messages ---------- */
function mentionsMe(text){
  if (!S.me || !text) return false;
  return new RegExp('(^|[^\\w])@' + escRe(S.me.username) + '(?![\\w.])', 'i').test(text);
}
function fmt(src){
  const ph = [];
  const hold = h => { ph.push(h); return `\uE000${ph.length - 1}\uE001`; };
  let s = esc(String(src).replace(/[\uE000\uE001]/g, ''));
  s = s.replace(/```([\s\S]+?)```/g, (_, c) => hold(`<pre>${c.replace(/^\n/, '')}</pre>`));
  s = s.replace(/`([^`\n]+)`/g, (_, c) => hold(`<code>${c}</code>`));
  s = s.replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g, u => hold(`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`));
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~\n]+)~~/g, '<s>$1</s>');
  s = s.replace(/(^|\n)&gt; ?([^\n]*)/g, '$1<blockquote>$2</blockquote>');
  s = s.replace(/(^|[^\w])@([A-Za-z0-9_.]{3,20})/g, (m, pre, name) => {
    const p = S.nameIdx.get(name.toLowerCase().replace(/\.+$/, ''));
    if (!p) return m;
    const tail = name.slice(p.username.length);
    return `${pre}<span class="mn" data-user="${p.id}">@${esc(p.username)}</span>${tail}`;
  });
  s = s.replace(/\n/g, '<br>').replace(/<\/blockquote><br>/g, '</blockquote>');
  return s.replace(/\uE000(\d+)\uE001/g, (_, i) => ph[+i]);
}
function snippet(m){ return m.content ? m.content.replace(/\s+/g, ' ').slice(0, 90) : 'Image'; }

function isCompact(m, prev){
  return !!prev && prev.user_id === m.user_id && !m.reply_to && dayKey(prev.created_at) === dayKey(m.created_at)
    && (new Date(m.created_at) - new Date(prev.created_at)) < 7 * 60000;
}
function reactsHTML(id){
  const byE = S.reacts.get(id);
  if (!byE || !byE.size) return '';
  let h = '<div class="reacts">';
  for (const [e, set] of byE) {
    const names = [...set].map(u => S.profiles.get(u)?.username).filter(Boolean).join(', ');
    h += `<button class="rc ${set.has(S.me.id) ? 'mine' : ''}" data-e="${esc(e)}" title="${esc(names)}">${esc(e)}<b>${set.size}</b></button>`;
  }
  return h + '</div>';
}
function msgEl(m, prev){
  const u = S.profiles.get(m.user_id) || { id: '', username: 'unknown', color: '#8b8982' };
  const compact = isCompact(m, prev);
  const el = document.createElement('div');
  el.className = 'msg' + (compact ? ' compact' : '') + (m.pending ? ' pending' : '') + (!m.pending && m.user_id !== S.me.id && mentionsMe(m.content) ? ' mention' : '');
  el.dataset.id = m.id;
  let h = '';
  if (m.reply_to) {
    const r = S.byId.get(m.reply_to), ru = r && S.profiles.get(r.user_id);
    h += `<div class="reply-ref" data-jump="${m.reply_to}">${r ? `<span class="rn">${esc(dn(ru) || 'unknown')}</span><span class="rt">${esc(snippet(r))}</span>` : '<span class="rt"><em>Original message was deleted</em></span>'}</div>`;
  }
  h += compact ? `<div class="gutter"><time>${fmtTime(m.created_at)}</time></div>` : `<div class="gutter">${avatarHTML(u, 38)}</div>`;
  h += '<div class="body">';
  if (!compact) h += `<div class="meta"><button class="name" data-user="${u.id}">${esc(dn(u))}</button>${u.is_admin ? '<span class="tag">admin</span>' : ''}<time title="${esc(new Date(m.created_at).toLocaleString())}">${fmtStamp(m.created_at)}</time></div>`;
  const silent = /^@silent\b/i.test(m.content || '');
  const body = silent ? m.content.replace(/^@silent\s*/i, '') : m.content;
  if (m.content) h += `<div class="text">${fmt(body)}${silent ? '<span class="silent">silent</span>' : ''}${m.edited_at ? ' <span class="edited">(edited)</span>' : ''}</div>`;
  if (m.image_url && (m.image_url.startsWith(IMG_PREFIX) || m.image_url.startsWith('blob:'))) h += `<img class="att" src="${esc(m.image_url)}" alt="" loading="lazy">`;
  if (!m.pending) h += reactsHTML(m.id);
  h += '</div>';
  if (!m.pending && !S.me.banned && !isMuted()) {
    const mine = m.user_id === S.me.id;
    h += `<div class="tools">${QUICK.map(e => `<button data-act="q" data-e="${e}" title="React ${e}">${e}</button>`).join('')}<button data-act="react" title="Add reaction">${I.smile}</button><button data-act="reply" title="Reply">${I.reply}</button>${mine && m.content ? `<button data-act="edit" title="Edit">${I.edit}</button>` : ''}${canDelete(m) ? `<button data-act="del" class="del" title="Delete">${I.trash}</button>` : ''}<button data-act="more" title="More">${I.dots}</button></div>`;
  }
  el.innerHTML = h;
  return el;
}
function dayEl(t){ const d = document.createElement('div'); d.className = 'day'; d.textContent = fmtDay(t); return d; }
function topEl(){
  const d = document.createElement('div');
  if (S.hasMore.get(S.current)) { d.className = 'loader'; d.innerHTML = '<div class="spin"></div>'; return d; }
  const c = S.channels.get(S.current);
  d.className = 'intro';
  if (c.kind === 'public') d.innerHTML = `<div class="big">#</div><h2>Welcome to #${esc(c.name)}</h2><p>${c.topic ? esc(c.topic) : 'This is the very start of the channel.'}</p>`;
  else if (c.kind === 'group') d.innerHTML = `<div class="big">${sv('<circle cx="9" cy="9" r="3"/><circle cx="16.5" cy="10" r="2.4"/><path d="M3.5 18.5c.7-2.6 2.8-4 5.5-4s4.8 1.4 5.5 4M15 14.6c2.3-.3 4.4.9 5.2 3.4"/>', 30)}</div><h2>${esc(c.name)}</h2><p>The start of your group. Only members can see this.</p>`;
  else { const o = dmOther(c); d.innerHTML = `<div style="margin-bottom:16px">${avatarHTML(o, 60)}</div><h2>${esc(o?.username || 'Unknown')}</h2><p>This is the start of your DMs with <b>${esc(o?.username || '')}</b>.</p>`; }
  return d;
}

function renderMessages(stick){
  const box = $('msgs'), inner = $('msgsInner');
  const fromBottom = box.scrollHeight - box.scrollTop;
  const list = S.msgs.get(S.current) || [];
  const frag = document.createDocumentFragment();
  frag.appendChild(topEl());
  let prev = null;
  for (const m of list) {
    if (!prev || dayKey(prev.created_at) !== dayKey(m.created_at)) frag.appendChild(dayEl(m.created_at));
    frag.appendChild(msgEl(m, prev)); prev = m;
  }
  for (const p of S.pending) if (p.channel_id === S.current) { frag.appendChild(msgEl(p, prev)); prev = p; }
  inner.replaceChildren(frag);
  if (stick) scrollBottom(); else box.scrollTop = box.scrollHeight - fromBottom;
  if (S.hasMore.get(S.current) && box.scrollHeight <= box.clientHeight + 300) loadOlder();
}
function domInsertTail(m){
  const inner = $('msgsInner'), list = S.msgs.get(m.channel_id);
  const prev = list[list.length - 2] || null;
  const ref = inner.querySelector('.msg.pending');
  if (!prev || dayKey(prev.created_at) !== dayKey(m.created_at)) inner.insertBefore(dayEl(m.created_at), ref);
  inner.insertBefore(msgEl(m, prev), ref);
}
function patchMsg(id){
  const m = S.byId.get(id);
  if (!m || m.channel_id !== S.current) return;
  const list = S.msgs.get(S.current) || [];
  const i = list.findIndex(x => x.id === id);
  const el = $('msgsInner').querySelector(`.msg[data-id="${id}"]`);
  if (i < 0 || !el) return;
  const sel = el.classList.contains('sel');
  const next = msgEl(list[i], list[i - 1] || null);
  if (sel) next.classList.add('sel');
  el.replaceWith(next);
}
function scrollBottom(){ const b = $('msgs'); b.scrollTop = b.scrollHeight; S.nearBottom = true; $('jumpBtn').classList.add('hidden'); }

$('msgs').addEventListener('scroll', () => {
  const b = $('msgs');
  S.nearBottom = b.scrollHeight - b.scrollTop - b.clientHeight < 90;
  if (S.nearBottom) { $('jumpBtn').classList.add('hidden'); if (S.unread.has(S.current) && !document.hidden) markRead(S.current); }
  if (b.scrollTop < 300) loadOlder();
}, { passive: true });
$('msgsInner').addEventListener('load', e => { if (e.target.tagName === 'IMG' && S.nearBottom) scrollBottom(); }, true);
$('jumpBtn').onclick = () => { scrollBottom(); markRead(S.current); };

async function loadOlder(){
  const ch = S.current;
  if (S.loadingOlder || !S.hasMore.get(ch)) return;
  S.loadingOlder = true;
  await loadMessages(ch, true);
  S.loadingOlder = false;
  if (ch === S.current) renderMessages(false);
}

/* message interactions */
$('msgsInner').addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const t = e.target;
  const row = t.closest('.msg');
  const id = row && !row.classList.contains('pending') ? Number(row.dataset.id) : null;
  const act = t.closest('[data-act]');
  if (act && id) {
    const m = S.byId.get(id), a = act.dataset.act;
    if (a === 'q') toggleReact(id, act.dataset.e);
    else if (a === 'react') openPicker(act, em => toggleReact(id, em));
    else if (a === 'reply') startReply(m);
    else if (a === 'edit') startEdit(m);
    else if (a === 'del') confirmDelete(m);
    else if (a === 'more') openSheet(id);
    if (a !== 'react') deselectMsgs();
    return;
  }
  const chip = t.closest('.rc'); if (chip && id) { toggleReact(id, chip.dataset.e); deselectMsgs(); return; }
  const u = t.closest('[data-user]'); if (u && u.dataset.user) { openProfile(u.dataset.user); return; }
  if (t.matches('img.att')) { openLightbox(t.src); return; }
  const rr = t.closest('.reply-ref'); if (rr) { jumpTo(Number(rr.dataset.jump)); return; }
  if (t.closest('a')) return;
  if (row && isTouch) {
    const was = row.classList.contains('sel');
    document.querySelectorAll('.msg.sel').forEach(x => x.classList.remove('sel'));
    if (!was) row.classList.add('sel');
  }
});
/* hold a message (or right-click) for the action sheet */
let lp = null, suppressClick = false;
const cancelLp = () => { if (lp) { clearTimeout(lp.t); lp = null; } };
$('msgsInner').addEventListener('pointerdown', e => {

$('msgsInner').addEventListener('pointerup', cancelLp); $('msgsInner').addEventListener('pointercancel', cancelLp);
$('msgs').addEventListener('scroll', cancelLp, { passive: true });
$('msgsInner').addEventListener('contextmenu', e => {

  e.preventDefault(); openSheet(Number(row.dataset.id));
});
function openSheet(id){
  const m = S.byId.get(id); if (!m) return;
  const u = S.profiles.get(m.user_id);
  const mine = m.user_id === S.me.id, canAct = !S.me.banned && !isMuted();
  document.querySelectorAll('.msg.sel').forEach(x => x.classList.remove('sel'));
  const sh = openModal(`<div class="sheet-head">${avatarHTML(u, 30)}<div class="sh-t"><b>${esc(dn(u) || 'unknown')}</b><span>${esc(snippet(m))}</span></div></div>
    ${canAct ? `<div class="sheet-react">${SHEET_EMOJI.map(e => `<button data-e="${e}" class="${S.reacts.get(id)?.get(e)?.has(S.me.id) ? 'on' : ''}">${e}</button>`).join('')}<button data-a="more" title="More reactions">${I.plusBig}</button></div>` : ''}
    <div class="sheet-list">
      ${canAct ? `<button data-a="reply">${I.reply}<span>Reply</span></button>` : ''}
      ${m.content ? `<button data-a="copy">${I.copy}<span>Copy text</span></button>` : ''}
      <button data-a="profile">${I.person}<span>${mine ? 'Your profile' : 'View profile'}</span></button>
      ${mine && m.content && canAct ? `<button data-a="edit">${I.edit}<span>Edit</span></button>` : ''}
      ${canDelete(m) ? `<button data-a="del" class="danger">${I.trash}<span>Delete${mine && !S.me.is_admin ? ' (under 5 min)' : ''}</span></button>` : ''}
    </div>`, 'sheet');
  sh.el.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.e) { sh.close(); toggleReact(id, b.dataset.e); return; }
    const a = b.dataset.a;
    if (a === 'more') { openPicker(b, em => { sh.close(); toggleReact(id, em); }); return; }
    sh.close();
    if (a === 'reply') startReply(m);
    else if (a === 'copy') { try { await navigator.clipboard.writeText(m.content); toast('Copied'); } catch { toast('Couldn\u2019t copy'); } }
    else if (a === 'profile') openProfile(m.user_id);
    else if (a === 'edit') startEdit(m);
    else if (a === 'del') confirmDelete(m);
  };
}
function jumpTo(id){
  const el = $('msgsInner').querySelector(`.msg[data-id="${id}"]`);
  if (!el) { toast('That message is further back'); return; }
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

async function toggleReact(id, emoji){
  if (S.me.banned) return;
  const mine = !!S.reacts.get(id)?.get(emoji)?.has(S.me.id);
  applyReact(id, S.me.id, emoji, !mine); patchMsg(id);
  const { error } = mine
    ? await sb.from('reactions').delete().match({ message_id: id, user_id: S.me.id, emoji })
    : await sb.from('reactions').insert({ message_id: id, user_id: S.me.id, emoji });
  if (error && error.code !== '23505') { applyReact(id, S.me.id, emoji, mine); patchMsg(id); toast('Reaction failed'); }
}

function openPicker(anchor, onPick){
  closePicker();
  const p = document.createElement('div');
  p.className = 'picker';
  p.innerHTML = EMOJIS.map(e => `<button data-e="${e}">${e}</button>`).join('') + `<button class="pk-x" data-x title="Close">${I.x}</button>`;
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
  const x = Math.min(innerWidth - w - 8, Math.max(8, r.right - w));
  let y = r.top - h - 6; if (y < 8) y = Math.min(innerHeight - h - 8, r.bottom + 6);
  p.style.left = x + 'px'; p.style.top = y + 'px';
  p.onclick = e => {
    if (e.target.closest('[data-x]')) { closePicker(); deselectMsgs(); return; }
    const b = e.target.closest('[data-e]'); if (b) { onPick(b.dataset.e); closePicker(); deselectMsgs(); }
  };
  const outside = e => { if (!p.contains(e.target)) { closePicker(); if (!e.target.closest('.msg.sel')) deselectMsgs(); } };
  setTimeout(() => document.addEventListener('pointerdown', outside), 0);
  S.picker = { p, outside };
}
function closePicker(){ if (S.picker) { S.picker.p.remove(); document.removeEventListener('pointerdown', S.picker.outside); S.picker = null; } }

input.addEventListener('keydown', e => {
  if (!$('mentionList').classList.contains('hidden')) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveMention(e.key === 'ArrowDown' ? 1 : -1); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(); return; }
    if (e.key === 'Escape') { e.preventDefault(); hideMentions(); return; }

    const mine = [...(S.msgs.get(S.current) || [])].reverse().find(m => m.user_id === S.me.id && m.content);
    if (mine) { e.preventDefault(); startEdit(mine); }
  }
});

async function loadBitmap(f){
  try { return await createImageBitmap(f); }
  catch { return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); }); }
}
async function prepImage(f){
  const ok = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
  if (f.type === 'image/gif' || (ok.includes(f.type) && f.size < 500000)) return f;
  try {
    const bmp = await loadBitmap(f);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .86));
    return blob ? new File([blob], 'image.jpg', { type: 'image/jpeg' }) : f;
  } catch { return f; }
}
async function upload(f){
  const file = await prepImage(f);
  const ext = ({ 'image/png': 'png', 'image/gif': 'gif', 'image/webp': 'webp' })[file.type] || 'jpg';
  const path = `${S.me.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from('attachments').upload(path, file, { contentType: file.type, cacheControl: '31536000' });
  if (error) { toast(/size|large/i.test(error.message) ? 'Image is over 5 MB' : 'Upload failed'); return null; }
  return sb.storage.from('attachments').getPublicUrl(path).data.publicUrl;
}

let tmpN = 0;
async function send(){
  if (!S.me || S.me.banned || !S.current) return;
  const text = input.value.trim();
  if (text.length > 2000) { toast('Message is over 2000 characters'); return; }

  if (S.editing) {
    const m = S.editing;
    if (!text) { toast('Message can\u2019t be empty. Delete it instead.'); return; }
    cancelCompose(); input.value = ''; autosize(); updateSend();
    if (text === m.content) return;
    const upd = { ...m, content: text, edited_at: new Date().toISOString() };
    S.byId.set(m.id, upd);
    const list = S.msgs.get(m.channel_id); const i = list ? list.findIndex(x => x.id === m.id) : -1; if (i >= 0) list[i] = upd;
    patchMsg(m.id);
    const { error } = await sb.from('messages').update({ content: text, edited_at: upd.edited_at }).eq('id', m.id);
    if (error) { toast('Edit failed'); S.byId.set(m.id, m); if (i >= 0) list[i] = m; patchMsg(m.id); }
    return;
  }

  if (!text && !S.file) return;
  if (text.startsWith('/') && !S.file) {
    const handled = await runCommand(text);
    if (handled) { input.value = ''; autosize(); updateSend(); return; }
  }
  const ch = S.current, reply = S.reply, file = S.file;
  const tmp = { id: 't' + (++tmpN), pending: true, channel_id: ch, user_id: S.me.id, content: text, reply_to: reply ? reply.id : null, image_url: file ? URL.createObjectURL(file) : null, created_at: new Date().toISOString() };
  S.pending.push(tmp);
  input.value = ''; autosize();
  S.reply = null; $('compBar').classList.add('hidden');
  S.file = null; $('compImg').classList.add('hidden'); $('compImgEl').removeAttribute('src'); updateSend(); hideMentions();
  renderMessages(true);

  let image_url = null;
  if (file) image_url = await upload(file);
  const dropTmp = () => {
    S.pending = S.pending.filter(p => p !== tmp);
    $('msgsInner').querySelector(`.msg[data-id="${tmp.id}"]`)?.remove();
    if (tmp.image_url) URL.revokeObjectURL(tmp.image_url);
  };
  if (file && !image_url) { dropTmp(); if (!input.value) { input.value = text; autosize(); } setFile(file); return; }

  const { data, error } = await sb.from('messages').insert({ channel_id: ch, user_id: S.me.id, content: text, reply_to: tmp.reply_to, image_url }).select().single();
  dropTmp();
  if (error) { toast('Message didn\u2019t send'); if (!input.value) { input.value = text; autosize(); updateSend(); } return; }
  const pos = addMessage(data);
  S.lastAt.set(ch, data.created_at);
  if (ch === S.current && pos) { if (pos === 'end') domInsertTail(data); else renderMessages(false); scrollBottom(); }
  renderSidebar();
}

/* slash commands */
async function runCommand(text){
  const [cmd, ...rest] = text.slice(1).trim().split(/\s+/);
  const c = (cmd || '').toLowerCase();
  if (c === 'admin') { openAdmin(); return true; }
  if (c === 'help') { toast('/mute @user minutes · /unmute @user · /ban @user · /unban @user · /admin'); return true; }
  if (c === 'silent') return false;
  if (!['mute', 'unmute', 'ban', 'unban'].includes(c)) { toast(`Unknown command /${c}. Try /help`); return true; }
  if (!S.me.is_admin) { toast('Admins only'); return true; }
  const name = (rest[0] || '').replace(/^@/, '').toLowerCase();
  const u = S.nameIdx.get(name);
  if (!u) { toast(name ? `No user @${name}` : `Usage: /${c} @user${c === 'mute' ? ' minutes' : ''}`); return true; }
  let r;
  if (c === 'mute') {
    const mins = parseInt(rest[1], 10);
    if (!(mins > 0)) { toast('Usage: /mute @user minutes'); return true; }
    r = await sb.rpc('admin_mute', { p_user: u.id, p_minutes: mins });
    if (!r.error) toast(`Muted ${u.username} for ${fmtMins(mins)}`);
  } else if (c === 'unmute') {
    r = await sb.rpc('admin_mute', { p_user: u.id, p_minutes: 0 });
    if (!r.error) toast(`Unmuted ${u.username}`);
  } else {
    r = await sb.rpc('admin_set', { p_user: u.id, p_field: 'banned', p_value: c === 'ban' });
    if (!r.error) toast(`${c === 'ban' ? 'Banned' : 'Unbanned'} ${u.username}`);
  }
  if (r.error) toast(friendly(r.error));
  return true;
}

/* mention autocomplete */
let mst = { items: [], idx: 0, start: 0 };
function updateMentions(){
  const pos = input.selectionStart, before = input.value.slice(0, pos);
  const m = before.match(/(?:^|\s)@([A-Za-z0-9_.]{0,20})$/);
  if (!m) return hideMentions();
  const q = m[1].toLowerCase(), c = S.channels.get(S.current);
  const pool = c.kind === 'public' ? [...S.profiles.values()] : [...(S.members.get(c.id) || [])].map(id => S.profiles.get(id)).filter(Boolean);
  const items = pool.filter(p => p.id !== S.me.id && p.username.toLowerCase().startsWith(q))
    .sort((a, b) => (S.online.has(b.id) - S.online.has(a.id)) || a.username.localeCompare(b.username)).slice(0, 6);
  if (!items.length) return hideMentions();
  mst = { items, idx: 0, start: pos - m[1].length - 1 };
  drawMentions();
}
function drawMentions(){
  const el = $('mentionList');
  el.innerHTML = mst.items.map((p, i) => `<button type="button" class="${i === mst.idx ? 'on' : ''}" data-i="${i}">${avatarHTML(p, 24, true).replace('data-user=', 'data-x=')}<span>${esc(dn(p))}${p.display_name ? ` <span style="color:var(--muted);font-weight:400">@${esc(p.username)}</span>` : ''}</span></button>`).join('');
  el.classList.remove('hidden');
}
function hideMentions(){ $('mentionList').classList.add('hidden'); }
function moveMention(d){ mst.idx = (mst.idx + d + mst.items.length) % mst.items.length; drawMentions(); }
function pickMention(i = mst.idx){
  const p = mst.items[i]; if (!p) return;
  const v = input.value, pos = input.selectionStart;
  input.value = v.slice(0, mst.start) + '@' + p.username + ' ' + v.slice(pos);
  const np = mst.start + p.username.length + 2;
  input.setSelectionRange(np, np);
  hideMentions(); autosize(); updateSend(); input.focus();
}
$('mentionList').addEventListener('pointerdown', e => { const b = e.target.closest('[data-i]'); if (b) { e.preventDefault(); pickMention(+b.dataset.i); } });

/* ---------- modals ---------- */
const modals = [];
function openModal(html, cls = ''){
  const bg = document.createElement('div');
  bg.className = 'modal-bg' + (cls ? ' bg-' + cls : '');
  bg.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  document.body.appendChild(bg);
  const m = { el: bg.firstElementChild, bg, close(){ bg.remove(); const i = modals.indexOf(m); if (i >= 0) modals.splice(i, 1); if (m.onclose) m.onclose(); } };
  bg.addEventListener('pointerdown', e => { if (e.target === bg) m.close(); });
  m.el.addEventListener('click', e => { if (e.target.closest('[data-close]')) m.close(); });
  modals.push(m);
  const f = m.el.querySelector('input:not([type=checkbox]),textarea');
  if (f && !isTouch) setTimeout(() => f.focus(), 30);
  return m;
}
function closeModals(){ while (modals.length) modals[modals.length - 1].close(); }
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.picker) { closePicker(); return; }
  if (!$('lightbox').classList.contains('hidden')) { $('lightbox').classList.add('hidden'); return; }
  if (modals.length) modals[modals.length - 1].close();
});
function confirmBox(title, text, okLabel){
  return new Promise(res => {
    const m = openModal(`<h3>${esc(title)}</h3><p class="hint">${esc(text)}</p><div class="row"><button class="btn" data-close>Cancel</button><button class="btn danger fill" data-ok>${esc(okLabel)}</button></div>`);
    let v = false;
    m.onclose = () => res(v);
    m.el.querySelector('[data-ok]').onclick = () => { v = true; m.close(); };
  });
}

/* people picker used by DM / group modals */
function peoplePicker(host, { multi, exclude = new Set(), onPick }){
  const chosen = new Set();
  host.innerHTML = `<input class="inp" placeholder="Search people" autocapitalize="off" spellcheck="false"><div class="pick-list"></div>`;
  const q = host.querySelector('input'), list = host.querySelector('.pick-list');
  const draw = () => {
    const s = q.value.trim().toLowerCase();
    const people = [...S.profiles.values()].filter(p => p.id !== S.me.id && !exclude.has(p.id) && p.username.toLowerCase().includes(s))
      .sort((a, b) => (S.online.has(b.id) - S.online.has(a.id)) || a.username.localeCompare(b.username));
    list.innerHTML = people.map(p => `<button type="button" class="pick ${chosen.has(p.id) ? 'on' : ''}" data-id="${p.id}">${avatarHTML(p, 28, true).replace('data-user=', 'data-x=')}<span class="nm">${esc(dn(p))}</span>${multi ? `<span class="chk">${I.check}</span>` : ''}</button>`).join('') || '<div class="pick-empty">No one found</div>';
  };
  q.oninput = draw;
  list.onclick = e => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    if (!multi) { onPick(b.dataset.id); return; }
    chosen.has(b.dataset.id) ? chosen.delete(b.dataset.id) : chosen.add(b.dataset.id);
    draw(); onPick && onPick([...chosen]);
  };
  draw();
  return chosen;
}

async function adminAction(u, a){

  else if (a === 'ban' || a === 'admin') {
    const field = a === 'ban' ? 'banned' : 'is_admin', val = !u[field];

    const { error } = await sb.rpc('admin_set', { p_user: u.id, p_field: field, p_value: val });

    S.profiles.set(u.id, { ...u, [field]: val });
    toast(field === 'banned' ? (val ? `${u.username} banned` : `${u.username} unbanned`) : (val ? `${u.username} is now admin` : 'Admin removed'));
  } else if (a === 'purge') {
